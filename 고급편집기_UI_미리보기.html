<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MangaTranslatorKo 고급 편집기 UI 미리보기</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111827;
      --ink-2: #1f2937;
      --line-dark: #334155;
      --paper: #f6f8fb;
      --field: #ffffff;
      --line: #cbd5e1;
      --muted: #64748b;
      --text: #172033;
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --canvas: #20242b;
      --amber: #f59e0b;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    button, textarea, select, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      display: grid;
      grid-template-columns: 92px minmax(330px, 390px) 1fr;
      grid-template-rows: 54px 1fr 32px;
      width: 100vw;
      height: 100vh;
      min-width: 1050px;
      color: var(--text);
      background: var(--canvas);
    }

    .topbar {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 250px 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 0 14px;
      color: #e5e7eb;
      background: var(--ink);
      border-bottom: 1px solid #263244;
    }

    .brand { display: flex; align-items: baseline; gap: 10px; font-weight: 700; }
    .brand small { color: #93c5fd; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
    .top-actions { display: flex; gap: 4px; }
    .top-actions:last-child { justify-content: flex-end; }
    .topbar button {
      min-height: 34px;
      padding: 0 12px;
      color: #e5e7eb;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
    }
    .topbar button:hover, .topbar button:focus-visible { background: var(--ink-2); border-color: var(--line-dark); }

    .rail {
      grid-row: 2 / 4;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 10px 7px;
      background: var(--ink);
      border-right: 1px solid #263244;
    }
    .rail button {
      min-height: 43px;
      padding: 8px 6px;
      color: #cbd5e1;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
    }
    .rail button:hover, .rail button:focus-visible { color: white; background: var(--ink-2); border-color: var(--line-dark); }
    .rail button.active { color: white; background: var(--blue); border-color: #60a5fa; }

    .inspector {
      grid-row: 2;
      overflow: auto;
      padding: 18px 16px 30px;
      background: var(--paper);
      border-right: 1px solid #aeb8c6;
    }
    .inspector h1 { margin: 0 0 4px; font-size: 18px; }
    .inspector .description { min-height: 40px; margin: 0 0 18px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .section { padding: 15px 0; border-top: 1px solid #dbe4ee; }
    .section:first-of-type { padding-top: 0; border-top: 0; }
    .section h2 { margin: 0 0 10px; font-size: 12px; }
    .field { display: grid; gap: 6px; margin-bottom: 11px; }
    .field label { color: #334155; font-size: 12px; font-weight: 600; }
    textarea, select, input[type="number"] {
      width: 100%;
      padding: 8px 9px;
      color: var(--ink);
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
    }
    textarea:focus, select:focus, input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
    textarea { min-height: 92px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .button-row { display: flex; gap: 7px; }
    .control {
      min-height: 34px;
      flex: 1;
      padding: 7px 10px;
      color: var(--ink);
      font-weight: 700;
      background: #e8edf5;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .control:hover, .control:focus-visible { background: var(--blue-soft); border-color: #60a5fa; }
    .check { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 12px; }
    input[type="range"] { width: 100%; accent-color: var(--blue); }

    .workspace {
      grid-row: 2 / 4;
      display: grid;
      grid-template-rows: 46px 1fr;
      min-width: 0;
      background: var(--canvas);
    }
    .canvasbar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      color: #f8fafc;
      background: #202733;
      border-bottom: 1px solid #374151;
    }
    .canvasbar button {
      min-height: 30px;
      padding: 5px 10px;
      color: #f8fafc;
      background: #374151;
      border: 1px solid #4b5563;
      border-radius: 4px;
    }
    .canvasbar .zoom { min-width: 54px; text-align: center; font-size: 12px; font-weight: 700; }
    .stage { display: grid; place-items: center; overflow: auto; padding: 26px; }
    .page-wrap { position: relative; width: min(63vh, 560px); aspect-ratio: 3 / 4; flex: none; box-shadow: 0 16px 42px rgb(0 0 0 / 28%); }
    .page-wrap svg { display: block; width: 100%; height: 100%; background: white; }
    .region {
      position: absolute;
      border: 2px solid var(--amber);
      pointer-events: none;
    }
    .region.selected { border-color: #2196f3; }
    .region::before {
      content: attr(data-index);
      position: absolute;
      left: -2px;
      top: -20px;
      min-width: 20px;
      height: 18px;
      padding: 1px 5px;
      color: white;
      font-size: 11px;
      line-height: 16px;
      background: #334155;
    }
    .region.one { left: 62%; top: 7%; width: 28%; height: 26%; }
    .region.two { left: 10%; top: 57%; width: 25%; height: 26%; }
    .region.three { left: 57%; top: 66%; width: 31%; height: 17%; }

    .status {
      grid-column: 2;
      grid-row: 3;
      display: flex;
      align-items: center;
      padding: 0 12px;
      color: #1e3a8a;
      background: #eef6ff;
      border-top: 1px solid #bfdbfe;
      font-size: 11px;
    }

    .notice {
      position: fixed;
      right: 14px;
      bottom: 12px;
      padding: 7px 10px;
      color: #cbd5e1;
      background: var(--ink);
      border: 1px solid var(--line-dark);
      border-radius: 6px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">MangaTranslatorKo <small>UI PREVIEW</small></div>
      <div class="top-actions"><button type="button">실행 취소</button><button type="button">다시 실행</button></div>
      <div class="top-actions"><button type="button">저장</button><button type="button">내보내기</button></div>
    </header>

    <nav class="rail" aria-label="편집 도구">
      <button class="active" data-tool="선택" type="button">선택</button>
      <button data-tool="텍스트" type="button">텍스트</button>
      <button data-tool="지우기" type="button">지우기</button>
      <button data-tool="그리기" type="button">그리기</button>
      <button data-tool="원본 복구" type="button">원본 복구</button>
    </nav>

    <aside class="inspector">
      <h1 id="panel-title">선택</h1>
      <p class="description" id="panel-description">영역을 선택하고 이동하거나 크기를 조정합니다.</p>
      <section class="section">
        <div class="field"><label for="region">텍스트 영역</label><select id="region"><option>1. 말풍선 | UI 미리보기</option><option>2. 세로 효과음 | 테스트</option><option>3. 안내 문구 | 편집 화면 테스트</option></select></div>
        <div class="button-row"><button class="control" type="button">추가</button><button class="control" type="button">삭제</button></div>
      </section>
      <section class="section">
        <div class="field"><label for="source">원문</label><textarea id="source" readonly>&lt;BN&gt;UIプレビュー&lt;/BN&gt;</textarea></div>
        <div class="field"><label for="translation">편집할 텍스트</label><textarea id="translation">UI 미리보기</textarea></div>
        <div class="button-row"><button class="control" type="button">굵게</button><button class="control" type="button">기울임</button><button class="control" type="button">굵+기</button></div>
      </section>
      <section class="section">
        <div class="field"><label for="align">정렬</label><select id="align"><option>가운데</option><option>왼쪽</option><option>오른쪽</option></select></div>
        <label class="check"><input type="checkbox" checked> 이 영역 렌더링</label>
        <label class="check"><input type="checkbox"> 세로쓰기</label>
        <div class="row"><div class="field"><label for="x">X</label><input id="x" type="number" value="565"></div><div class="field"><label for="y">Y</label><input id="y" type="number" value="110"></div></div>
        <div class="row"><div class="field"><label for="width">너비</label><input id="width" type="number" value="200"></div><div class="field"><label for="height">높이</label><input id="height" type="number" value="220"></div></div>
        <div class="field"><label for="size">글자 크기 34px</label><input id="size" type="range" min="12" max="80" value="34"></div>
      </section>
    </aside>

    <main class="workspace">
      <div class="canvasbar"><button type="button">화면 이동</button><button type="button">−</button><span class="zoom">57%</span><button type="button">＋</button><button type="button">맞춤</button><button type="button">100%</button></div>
      <div class="stage">
        <div class="page-wrap" aria-label="샘플 만화 페이지">
          <svg viewBox="0 0 600 800" role="img" aria-label="UI 확인용 가상 만화 페이지">
            <rect width="600" height="800" fill="#f8fafc"/>
            <rect x="24" y="22" width="552" height="756" fill="white" stroke="#111827" stroke-width="5"/>
            <rect x="46" y="44" width="508" height="330" fill="#d8dde3" stroke="#111827" stroke-width="4"/>
            <path d="M48 350L280 46M90 374L322 46M132 374L364 46M174 374L406 46M216 374L448 46M258 374L490 46M300 374L532 46" stroke="#a8afb8" stroke-width="2"/>
            <rect x="46" y="396" width="228" height="354" fill="#c8ced6" stroke="#111827" stroke-width="4"/>
            <rect x="298" y="396" width="256" height="354" fill="#e3e6ea" stroke="#111827" stroke-width="4"/>
            <ellipse cx="430" cy="158" rx="92" ry="112" fill="white" stroke="#111827" stroke-width="4"/>
            <ellipse cx="144" cy="570" rx="78" ry="112" fill="white" stroke="#111827" stroke-width="4"/>
            <rect x="350" y="520" width="156" height="118" rx="30" fill="white" stroke="#111827" stroke-width="4"/>
            <text x="430" y="164" text-anchor="middle" font-family="Segoe UI, Malgun Gothic" font-size="29" font-weight="700">UI 미리보기</text>
            <text x="144" y="520" text-anchor="middle" font-family="Segoe UI, Malgun Gothic" font-size="34" font-weight="700"><tspan x="144" dy="0">테</tspan><tspan x="144" dy="42">스</tspan><tspan x="144" dy="42">트</tspan></text>
            <text x="428" y="566" text-anchor="middle" font-family="Segoe UI, Malgun Gothic" font-size="26" font-weight="700"><tspan x="428">편집 화면</tspan><tspan x="428" dy="34">테스트</tspan></text>
          </svg>
          <span class="region one selected" data-index="1"></span>
          <span class="region two" data-index="2"></span>
          <span class="region three" data-index="3"></span>
        </div>
      </div>
    </main>

    <div class="status" id="status">선택 도구 · 시각 프로토타입</div>
    <div class="notice">UI 전용 · 번역기와 터미널은 실행되지 않습니다</div>
  </div>

  <script>
    const descriptions = {
      "선택": "영역을 선택하고 이동하거나 크기를 조정합니다.",
      "텍스트": "번역문과 글꼴, 정렬, 영역 크기를 조정합니다.",
      "지우기": "원문을 지울 영역과 인페인팅 옵션을 확인합니다.",
      "그리기": "브러시 색과 크기를 선택해 이미지 위에 그립니다.",
      "원본 복구": "필요한 부분만 원본 이미지에서 다시 가져옵니다."
    };
    const title = document.querySelector("#panel-title");
    const description = document.querySelector("#panel-description");
    const status = document.querySelector("#status");
    document.querySelectorAll(".rail button").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelector(".rail .active").classList.remove("active");
        button.classList.add("active");
        title.textContent = button.dataset.tool;
        description.textContent = descriptions[button.dataset.tool];
        status.textContent = `${button.dataset.tool} 도구 · 시각 프로토타입`;
      });
    });
  </script>
</body>
</html>
